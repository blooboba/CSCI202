<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bellingham Bites Guide - Local Restaurants</title>
    <meta name="description" content="Discover the best restaurants from Bellingham to Ferndale">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div 
            class="header-background"
            style="background-image: url('images/bellingham.jpg');"
        ></div>
        <div class="header-overlay"></div>
        <div class="container header-content">
            <h1 class="header-title">
                Local Restaurants from<br>
                Bellingham to Ferndale
            </h1>
            <button id="darkModeToggle" class="dark-mode-toggle" aria-label="Toggle dark mode">
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- Search Bar -->
            <div class="search-container">
                <div class="search-bar">
                    <div class="search-input-container">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="M21 21l-4.35-4.35"></path>
                        </svg>
                        <input type="text" id="searchInput" placeholder="Search restaurants..." class="search-input">
                    </div>
                    <div class="category-dropdown-container">
                        <button id="categoryButton" class="category-button">
                            <span id="selectedCategory">All Categories</span>
                            <svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6,9 12,15 18,9"></polyline>
                            </svg>
                        </button>
                        <div id="categoryDropdown" class="category-dropdown hidden">
                            <!-- Categories will be populated by JavaScript -->
                        </div>
                    </div>
                    <div class="favorites-filter">
                        <button id="favoritesToggle" class="favorites-toggle">
                            <svg class="bookmark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path>
                            </svg>
                            <span>Show Favorites</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Restaurant Cards Container -->
            <div id="restaurantsContainer" class="restaurants-container">
                <!-- Restaurant cards will be populated by JavaScript -->
            </div>

            <!-- No Results Message -->
            <div id="noResults" class="no-results hidden">
                <p class="no-results-title">No restaurants found matching your criteria.</p>
                <p class="no-results-subtitle">Try adjusting your search or category filter.</p>
            </div>
        </div>
    </main>

    <!-- Review Modal -->
    <div id="reviewModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalRestaurantName">Add Review</h2>
                <button class="modal-close" onclick="closeReviewModal()">×</button>
            </div>
            <form id="reviewForm" class="review-form">
                <div class="form-group">
                    <label for="reviewerName">Your Name</label>
                    <input type="text" id="reviewerName" required>
                </div>
                
                <div class="form-group">
                    <label>Rating</label>
                    <div class="star-rating">
                        <span class="star" data-rating="1">★</span>
                        <span class="star" data-rating="2">★</span>
                        <span class="star" data-rating="3">★</span>
                        <span class="star" data-rating="4">★</span>
                        <span class="star" data-rating="5">★</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="reviewText">Your Review</label>
                    <textarea id="reviewText" rows="4" required placeholder="Share your experience..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="reviewPhoto">Add Photo (optional)</label>
                    <input type="file" id="reviewPhoto" accept="image/*">
                    <div id="photoPreview" class="photo-preview hidden"></div>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeReviewModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Submit Review</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.0/firebase-app.js";
      import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/11.9.0/firebase-firestore.js";

      // Your Firebase config
      const firebaseConfig = {
        apiKey: "AIzaSyA4FxyRTgByqjynJARAdY1IHSFkVeITQ28",
        authDomain: "bellingham-eats.firebaseapp.com",
        projectId: "bellingham-eats",
        storageBucket: "bellingham-eats.firebasestorage.app",
        messagingSenderId: "499445930934",
        appId: "1:499445930934:web:6abcbdc39c64b5fd25ff17"
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // Expose globally for your script.js to access
      window.firebaseApp = app;
      window.firestore = db;
      window.collection = collection;
      window.getDocs = getDocs;
      window.addDoc = addDoc;
    </script>

    <script src="script.js" defer></script>
</body>
</html>
